name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Package the static site
        run: cd dist && zip -r "../framecheck-${GITHUB_REF_NAME}.zip" .
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          gh release create "$GITHUB_REF_NAME"
          "framecheck-${GITHUB_REF_NAME}.zip"
          --title "Framecheck ${GITHUB_REF_NAME}"
          --generate-notes
